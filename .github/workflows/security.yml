name: Security Audit

on:
  push:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [master]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
  schedule:
    # Weekly sweep so advisories published after the last dependency change
    # still surface (Mondays 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
